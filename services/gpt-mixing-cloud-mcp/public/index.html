<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GPT MIXING ОБЛАКО</title>
<style>:root{--bg:#061016;--panel:#10202a;--panel2:#142733;--line:#2c4653;--text:#f5f8fa;--muted:#9db0ba;--green:#4ce7a8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}.app{max-width:440px;margin:auto;padding:18px 15px 28px;min-height:100vh}.brand{font-size:27px;font-weight:900;margin:8px 0 15px}.brand b{color:var(--green)}.top{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card,.files,.track{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:12px}.label{font-size:15px;font-weight:800}.mcpbox{margin-top:8px;background:#f7fafb;color:#0b1216;border-radius:11px;padding:8px 10px;font-size:15px;font-weight:800}.ok{color:var(--green);font-size:13px;margin-top:7px}.readyrow{display:flex;justify-content:space-between;font-weight:750;font-size:15px}.readyrow strong{font-size:20px}.meter{height:6px;margin-top:12px;border-radius:99px;background:#263b45;overflow:hidden}.fill{width:0;height:100%;background:var(--green);transition:.3s}.files{margin-top:11px}.files h2{font-size:17px;margin:0 0 9px}.buttons,.actions,.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choose{border:1px solid var(--line);background:#172b36;color:var(--text);border-radius:13px;padding:12px;font-weight:800;font-size:15px}.choose.primary,.run{background:var(--green);color:#052117;border-color:var(--green)}.file{padding:9px 0;border-top:1px solid #263d49;font-size:14px}.sub{font-size:12px;color:var(--muted);margin-top:2px}.actions{margin-top:12px}.action{min-height:82px;border:0;border-radius:17px;padding:12px;color:#fff;text-align:left;font-size:18px;font-weight:900}.action span{display:block;font-size:13px;font-weight:650;opacity:.84;margin-top:4px}.a1{background:linear-gradient(135deg,#137ce2,#2558c2)}.disabled{opacity:.35;background:#405361}.run{width:100%;height:59px;margin-top:12px;border:0;border-radius:19px;font-size:19px;font-weight:900}.run:disabled{opacity:.35}.status{text-align:center;color:var(--muted);font-size:13px;margin:9px}.results{display:none;margin-top:12px}.results.show{display:block}.track{margin-bottom:9px}.track h3{font-size:17px;margin:0 0 9px}.metric{background:#142733;border-radius:11px;padding:9px}.metric small{display:block;color:var(--muted);font-size:11px}.metric strong{font-size:15px;word-break:break-word}.good{color:var(--green)}.bad{color:#ff6578}.warning{color:#ffb24e}</style></head>
<body><main class="app"><div class="brand">GPT MIXING <b>ОБЛАКО</b></div><section class="top"><div class="card"><div class="label">MCP</div><div class="mcpbox">GPT Mixing MCP</div><div class="ok">● Подключен</div></div><div class="card"><div class="readyrow"><span>Готовность</span><strong id="pct">0%</strong></div><div class="meter"><div class="fill" id="fill"></div></div></div></section><section class="files"><h2>Аудиодорожки</h2><div class="buttons"><button class="choose primary" id="upload">Загрузить</button><button class="choose" id="library">Из библиотеки</button></div><input id="picker" type="file" accept="audio/*,.wav,.wave,.aif,.aiff,.flac,.mp3,.m4a,.aac,.ogg" multiple hidden><div id="filelist"><div class="sub">Файлы не выбраны</div></div></section><section class="actions"><button class="action a1" id="analyze">АНАЛИЗ<span>Все измерения</span></button><button class="action disabled">РЕДАКТИРОВАТЬ<span>следующий этап</span></button><button class="action disabled">СВЕСТИ<span>следующий этап</span></button><button class="action disabled">СРАВНИТЬ<span>следующий этап</span></button><button class="action disabled">ИСПРАВИТЬ<span>следующий этап</span></button><button class="action disabled">ЭКСПОРТ<span>следующий этап</span></button></section><button class="run" id="run" disabled>▶ ЗАПУСТИТЬ АНАЛИЗ</button><div class="status" id="status">Добавьте одну или несколько дорожек</div><section class="results" id="results"></section></main>
<script>const $=id=>document.getElementById(id);let files=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function updateFiles(){if(!files.length){$('filelist').innerHTML='<div class="sub">Файлы не выбраны</div>';$('run').disabled=true;return}$('filelist').innerHTML=files.map(f=>`<div class="file"><strong>${esc(f.fileName)}</strong><div class="sub">${esc(f.mimeType||'audio')}</div></div>`).join('');$('run').disabled=false;$('status').textContent=`Выбрано дорожек: ${files.length}`;$('fill').style.width='10%';$('pct').textContent='10%'}async function uploadLocal(localFiles){if(!window.openai?.uploadFile){$('status').textContent='Загрузка файлов недоступна в этом хосте.';return}for(const file of localFiles){$('status').textContent=`Загружаю ${file.name}…`;const u=await window.openai.uploadFile(file,{library:true});const d=await window.openai.getFileDownloadUrl({fileId:u.fileId});files.push({fileId:u.fileId,fileName:file.name,mimeType:file.type||'audio/*',downloadUrl:d.downloadUrl})}updateFiles()}$('upload').onclick=()=>$('picker').click();$('picker').onchange=e=>uploadLocal([...e.target.files]).catch(err=>$('status').textContent='Ошибка загрузки: '+err.message);$('library').onclick=async()=>{if(!window.openai?.selectFiles){$('status').textContent='Библиотека недоступна.';return}try{const selected=await window.openai.selectFiles();for(const f of selected||[]){const d=await window.openai.getFileDownloadUrl({fileId:f.fileId});files.push({fileId:f.fileId,fileName:f.fileName||'audio',mimeType:f.mimeType||'audio/*',downloadUrl:d.downloadUrl})}updateFiles()}catch(e){$('status').textContent='Ошибка выбора: '+e.message}};function metric(k,v,cls=''){return `<div class="metric"><small>${esc(k)}</small><strong class="${cls}">${esc(v??'—')}</strong></div>`}function render(result){const score=result.readinessScore??0;$('fill').style.width=score+'%';$('pct').textContent=score+'%';$('results').classList.add('show');$('results').innerHTML=(result.tracks||[]).map(t=>`<article class="track"><h3>${esc(t.file)}</h3><div class="grid">${metric('Источник',t.source?.guess||'unknown')}${metric('Confidence',Math.round((t.source?.confidence||0)*100)+'%')}${metric('Peak',t.signal?.peakDbfs?.toFixed?.(2)+' dBFS',t.signal?.clippingSuspected?'bad':'good')}${metric('True Peak',t.loudness?.truePeakDbTP?.toFixed?.(2)+' dBTP')}${metric('RMS',t.signal?.rmsDbfs?.toFixed?.(2)+' dBFS')}${metric('LUFS-I',t.loudness?.integratedLUFS?.toFixed?.(1)+' LUFS')}${metric('LRA',t.loudness?.loudnessRangeLU?.toFixed?.(1)+' LU')}${metric('Centroid',Math.round(t.spectral?.centroidHz||0)+' Hz')}${metric('Rolloff',Math.round(t.spectral?.rolloffHz||0)+' Hz')}${metric('Сигнал',t.signal?.hasSignal?'есть':'нет',t.signal?.hasSignal?'good':'bad')}${metric('Clipping',t.signal?.clippingSuspected?'ЕСТЬ':'нет',t.signal?.clippingSuspected?'bad':'good')}${metric('Bleed',t.bleed?.status||'uncertain',t.bleed?.status==='suspected'?'warning':'')}</div></article>`).join('');$('status').textContent=`Анализ завершён. Дорожек: ${result.summary?.tracksAnalyzed||0}`}async function run(){if(!files.length)return;if(!window.openai?.callTool){$('status').textContent='MCP bridge недоступен.';return}$('run').disabled=true;$('status').textContent='Анализирую…';try{const payload={files:files.map(f=>({file_id:f.fileId,download_url:f.downloadUrl,mime_type:f.mimeType,file_name:f.fileName}))};const r=await window.openai.callTool('analyze_files',payload);const sc=r?.structuredContent||r?.structured_content||window.openai?.toolOutput;if(sc)render(sc);else $('status').textContent='Структурированный результат не получен.'}catch(e){$('status').textContent='Ошибка анализа: '+e.message}finally{$('run').disabled=false}}$('run').onclick=run;$('analyze').onclick=run;window.addEventListener('message',e=>{const m=e.data;if(m?.method==='ui/notifications/tool-result'&&m.params?.structuredContent)render(m.params.structuredContent)});const initial=window.openai?.toolOutput;if(initial?.tracks)render(initial);</script></body></html>
