# A3: Full primary approach (MusicEval only)
# A3b + uncertainty weighting + longer training
# Tests: learned loss balancing between MI and TA heads
# Delta from A3b: uncertainty_weighting, epochs=40

defaults:
  - base

experiment:
  name: "A3c"
  tags: ["primary", "lora", "contrastive", "phase2"]

data:
  use_songeval: false

model:
  tuning_mode: "lora"
  pooling: "attention"
  head_layers: 3
  head_hidden_dim: 512
  lora:
    r: 16
    alpha: 32
    target_modules: ["q_proj", "k_proj", "v_proj", "out_proj"]
    dropout: 0.1

loss:
  type: "ordinal_ce_contrastive"
  ordinal_bins: 5
  ordinal_sigma: 0.5
  contrastive_weight: 0.5
  contrastive_margin: 0.5
  contrastive_warmstart_epoch: 6
  uncertainty_weighting: true
  bias_calibration: false

training:
  epochs: 40
  batch_size: 16
  lr: 1.0e-4
  gradient_checkpointing: false
